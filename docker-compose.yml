services:
  web:
    build:
      context: .
    ports:
      - "8081:5000"
    volumes:
      - /mnt/pastore:/mnt/pastore
      - import-diagnostics:/var/lib/gestionale-import
    networks:
      - gestionale-network
    environment:
        IMPORT_DIAGNOSTIC_DIR: /var/lib/gestionale-import
        APP_VERSION: ${APP_VERSION:-unknown}
        DB_USER: repartoitsql
        DB_PASSWORD: Giovanni$
        DB_HOST: db-magazzino-mysql-1
        DB_PORT: "3306"
        DB_NAME: gestionale_acquisti
    user: "0:0"

networks:
  gestionale-network:
    external: true

volumes:
  import-diagnostics:
